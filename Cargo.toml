[package]
name = "nozomi-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Rust client for Nozomi, Temporal's Solana transaction landing service: typed endpoints, tip rotation and validation, batch framing, keep-alive, tip floor, and on-chain landing verification."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alizeeshan1234/nozomi-rs"
readme = "README.md"
exclude = ["PITCH.md", ".github/"]
keywords = ["solana", "nozomi", "temporal", "transaction", "landing"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[features]
default = ["solana"]
solana = ["dep:solana-pubkey", "dep:solana-instruction", "dep:solana-system-interface", "dep:solana-transaction", "dep:solana-message", "dep:bincode"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tracing = "0.1"
rand = "0.8"

solana-pubkey = { version = "4", optional = true }
solana-instruction = { version = "3", optional = true }
solana-system-interface = { version = "3", optional = true, features = ["bincode"] }
solana-transaction = { version = "4", optional = true, features = ["serde"] }
solana-message = { version = "4", optional = true }
bincode = { version = "1.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
