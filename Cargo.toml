[package]
name = "nozomi-client"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
description = "Rust client for Nozomi, Temporal's Solana transaction landing service: typed endpoints, tip rotation and validation, batch framing, keep-alive, HTTP/3 over QUIC, tip floor and tip stream, and on-chain landing verification."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alizeeshan1234/nozomi-rs"
readme = "README.md"
exclude = ["PITCH.md", ".github/"]
keywords = ["solana", "nozomi", "temporal", "transaction", "landing"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["solana"]
solana = ["dep:solana-pubkey", "dep:solana-instruction", "dep:solana-system-interface", "dep:solana-transaction", "dep:solana-message", "dep:bincode"]
# HTTP/3 over QUIC submission (`QuicClient`), for processes that cannot hold a warm TCP connection.
quic = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:rustls", "dep:webpki-roots", "dep:bytes"]
# Websocket tip stream (`TipStream`), the live feed behind `/tip_floor`.
tip-stream = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tracing = "0.1"
rand = "0.8"
http = "1"

quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
webpki-roots = { version = "1", optional = true }
bytes = { version = "1", optional = true }

tokio-tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

solana-pubkey = { version = "4", optional = true }
solana-instruction = { version = "3", optional = true }
solana-system-interface = { version = "3", optional = true, features = ["bincode"] }
solana-transaction = { version = "4", optional = true, features = ["serde"] }
solana-message = { version = "4", optional = true }
bincode = { version = "1.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wiremock = "0.6"
# Only tests/quic.rs uses it, for a self-signed server certificate.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
