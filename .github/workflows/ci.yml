name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p nozomi-demo -- -D warnings
      - run: cargo doc --no-deps --all-features

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""                      # default: solana
          - "--no-default-features --features quic"
          - "--no-default-features --features tip-stream"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}
      - run: cargo build -p nozomi-demo

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - run: cargo check --all-targets --all-features

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the action posts its report as a check run
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock is not committed (library crate); the audit needs one.
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
