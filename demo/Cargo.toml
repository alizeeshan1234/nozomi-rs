[package]
name = "nozomi-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end demo of the nozomi-client crate: size a tip, build and sign a transaction, send it through Nozomi over HTTP or QUIC, verify it on-chain."

[dependencies]
nozomi-client = { path = "..", version = "0.2", features = ["quic", "tip-stream"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

solana-keypair = "3"
solana-signer = "3"
solana-pubkey = "4"
solana-hash = "4"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-system-interface = { version = "3", default-features = false, features = ["wincode"] }
solana-compute-budget-interface = "3"
